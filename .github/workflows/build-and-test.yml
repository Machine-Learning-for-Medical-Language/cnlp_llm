name: Build and Test

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "test/**"
      - "pyproject.toml"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "test/**"
      - "pyproject.toml"
      - ".github/workflows/**"
jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        id: setup-uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "" # don't invalidate the cache to avoid re-downloading big dependencies (cuda)
      - name: Test with pytest
        run: |
          uv run -v --frozen --group test pytest
