name: Build

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "test/**"
      - "pyproject.toml"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "test/**"
      - "pyproject.toml"
jobs:
  ruff:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v1
        with:
          version: 0.6.9
          args: check
      - uses: astral-sh/ruff-action@v1
        with:
          version: 0.6.9
          args: format --check
  pyright:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
      - uses: jakebailey/pyright-action@v2
        with:
          pylance-version: latest-release
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        id: setup-uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install dependencies
        run: |
          uv sync --group test
      - name: Test with pytest
        run: |
          uv run pytest
