[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cnlp_llm"
version = "0.1.0"
description = "LLM training and evaluation for clinical NLP"
readme = "README.md"
requires-python = ">=3.10, <3.13"
dependencies = [
    "inspect-ai~=0.3.68",
    "openai~=1.44",
    "click~=8.1.7",
    "trl~=0.12.1",
    "fastapi~=0.114.0",
    "uvicorn~=0.32",
    "tiktoken~=0.8.0",
    "rich~=13.9.3",
    "datasets~=3.0.2",
    "scikit-learn>=1.6.1",
    "networkx>=3.4.2",
    "shortuuid>=1.0.13",
]

[dependency-groups]
lint = [
    "pyright[nodejs]>=1.1.386",
    "ruff==0.7.1",              # same as in pre-commit hooks
]
test = ["pytest>=8.3.3"]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    "pre-commit>=4.0.1",
]

[project.scripts]
"cnlp_llm" = "cnlp_llm.cli:main"

[project.urls]
Homepage = "https://github.com/Machine-Learning-for-Medical-Language/cnlp_llm"
Issues = "https://github.com/Machine-Learning-for-Medical-Language/cnlp_llm/issues"

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"
useLibraryCodeForTypes = true

[tool.uv.sources]
cnlp-llm = { workspace = true }
