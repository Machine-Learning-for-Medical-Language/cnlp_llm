[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cnlp_llm"
version = "0.1.0"
description = "LLM training and evaluation for clinical NLP"
readme = "README.md"
requires-python = "~=3.10"
dependencies = [
    "inspect_ai~=0.3",
    "openai~=1.44",
    "click~=8.1",
    "trl~=0.10",
    "fastapi~=0.114",
    "uvicorn~=0.30",
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pyright[nodejs]",
    "pytest",
    "ruff==0.6.9",     # same as in pre-commit hooks
]

[project.scripts]
"cnlp_llm" = "cnlp_llm.cli:main"

[project.urls]
Homepage = "https://github.com/Machine-Learning-for-Medical-Language/cnlp_llm"
Issues = "https://github.com/Machine-Learning-for-Medical-Language/cnlp_llm/issues"

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"
useLibraryCodeForTypes = true
