[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[project]
name = "cnlp_llm"
version = "0.1.0"
description = "LLM training and evaluation for clinical NLP"
readme = "README.md"
requires-python = ">=3.10, <3.14"
dependencies = [
    "inspect-ai~=0.3.155",
    "openai~=1.44",
    "click~=8.1.7",
    "trl[peft]~=0.12.1",
    "fastapi~=0.114.0",
    "uvicorn~=0.32",
    "tiktoken~=0.8.0",
    "rich~=13.9.3",
    "datasets~=3.0.2",
    "scikit-learn>=1.6.1",
    "networkx>=3.4.2",
    "shortuuid>=1.0.13",
    "anyio>=4.8.0",
    "transformers>=4.46.3",
]

[dependency-groups]
lint = [
    "pyright[nodejs]>=1.1.386",
    "pandas-stubs",
    "ruff==0.11.0",             # same as in pre-commit hooks and CI
]
test = ["pytest>=8.3.3"]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    "pre-commit>=4.0.1",
]

[project.scripts]
"cnlp_llm" = "cnlp_llm.cli:main"

[project.urls]
Homepage = "https://github.com/Machine-Learning-for-Medical-Language/cnlp_llm"
Issues = "https://github.com/Machine-Learning-for-Medical-Language/cnlp_llm/issues"

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"
useLibraryCodeForTypes = true

[tool.uv.sources]
cnlp-llm = { workspace = true }

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = [
    # ruff defaults
    "E4",
    "E7",
    "E9",
    "F",
    # additional options
    "I",    # isort
    "UP",   # pyupgrade
    "G",    # logging
    "FA",   # future annotations
    "N",    # naming conventions
    "PERF", # performance
    "RUF",  # misc
    "PIE",  # misc
]

ignore = [
    "G004", # f-strings in logging statements
]
